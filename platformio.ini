; ============================================================
;  Détecteur d'accords — ESP32-S3 N16R8 + clavier MIDI USB
;
;  ⚠️ IMPORTANT : l'USB Host MIDI exige arduino-esp32 >= 3.x.
;  La plateforme officielle PlatformIO ("platform = espressif32")
;  reste bloquée en core 2.0.17 -> erreurs de compilation BLE
;  dans ESP32_Host_MIDI et USB Host non fonctionnel.
;  On utilise donc la plateforme communautaire pioarduino.
;
;  Flasher :      pio run -e detecteur -t upload
;  Surveillance : pio device monitor
; ============================================================

[env:detecteur]
; ⚠️ Version épinglée : ne PAS utiliser .../download/stable/... — le zip "stable"
; bouge à chaque release pioarduino et peut casser un build qui marchait avant
; (c'est ce qui a déclenché le passage forcé en core 3.3.12 + le bug Network.h).
; 55.03.312-1 = Arduino 3.3.12 / IDF 5.5.5 + correctif de build SCons.
; Repli connu-good si besoin : 55.03.39 (Arduino 3.3.9 / IDF 5.5.4).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; "esp32-s3-devkitc-1-n16r8v" n'existe pas chez pioarduino :
; on prend la définition générique S3 et on force 16 Mo flash (QIO) + 8 Mo PSRAM octal (OPI)
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Bibliothèques privées du projet : lib/<nom>/src/ (préco PlatformIO).
; ⚠️ NE PAS utiliser chain+ : bug du Library Dependency Finder de PlatformIO
; avec le core Arduino 3.x (pioarduino#112) -> "Network.h: No such file or
; directory" à la compilation de la bibliothèque WiFi du framework, car le LDF
; n'ajoute pas la bibliothèque Network du core au chemin d'inclusion.
; En mode `chain`, le LDF scanne les fichiers source : main.cpp inclut
; directement midi_input.h, status_led.h, web_server.h et wifi_manager.h,
; et web_server.cpp fait remonter chord-detector et web-page.
; Rien à déclarer dans lib_deps pour les modules privés.
lib_ldf_mode = chain

; -I include : rend include/config.h visible depuis les bibliothèques privées
; de lib/ (les fichiers de include/ ne sont pas "globaux" pour le code de lib/
; en mode chain — sans ce flag : "config.h: No such file or directory").
build_flags =
    -I include
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ; USB Host MIDI (clavier branché sur le port OTG de l'ESP32-S3)
    sauloverissimo/ESP32_Host_MIDI
    ; Serveur web asynchrone + WebSocket (page temps réel)
    mathieucarbou/ESPAsyncWebServer @ ^3.0.0
    mathieucarbou/AsyncTCP @ ^3.0.0

; ------------------------------------------------------------
; (Configuration de repli utilisée ci-dessus — à garder en mémoire
;  si tu changes de carte : board générique + surcharges mémoire.)
; ------------------------------------------------------------